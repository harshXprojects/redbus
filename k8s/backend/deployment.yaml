apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: redbus
  labels:
    app: backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        component: api
    spec:
      containers:
        - name: backend
          image: harshxprojects/redbus-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3020
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: redbus-config
                  key: NODE_ENV
            # MONGO_USER and MONGO_PASSWORD must be defined BEFORE
            # MONGODB_URI so that k8s $(VAR) interpolation works
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: redbus-secret
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redbus-secret
                  key: MONGO_PASSWORD
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb-service:27017/redbus?authSource=admin"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          # tcpSocket probe — checks the port is open.
          # Safe because the app has no /health route.
          livenessProbe:
            tcpSocket:
              port: 3020
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3020
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

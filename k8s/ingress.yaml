apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redbus-ingress
  namespace: redbus
  labels:
    app: redbus
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: redbus.yourdomain.com   # replace with your domain / minikube IP
      http:
        paths:
          - path: /v1/api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3020
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
